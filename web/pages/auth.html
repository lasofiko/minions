<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация - Relink</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <!-- Логотип -->
        <div class="logo">
            <h1>Relink</h1>
        </div>

        <!-- Табы переключения Вход / Регистрация -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="loginTab">Вход</button>
            <button class="tab-btn" id="registerTab">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form class="auth-form active" id="loginForm">
            <div class="form-group">
                <label for="loginEmail">
                    <i class="far fa-envelope"></i>
                    Email
                </label>
                <input
                        type="email"
                        id="loginEmail"
                        placeholder="Введите ваш email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">
                    <i class="fas fa-lock"></i>
                    Пароль
                </label>
                <div class="password-input">
                    <input
                            type="password"
                            id="loginPassword"
                            placeholder="Введите пароль"
                            required
                    >
                    <button type="button" class="toggle-password">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-btn">
                Войти
            </button>
        </form>

        <!-- Форма регистрации (скрытая) -->
        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="regName">
                    <i class="far fa-user"></i>
                    Имя
                </label>
                <input
                        type="text"
                        id="regName"
                        placeholder="Введите ваше имя"
                        required
                >
            </div>

            <div class="form-group">
                <label for="regEmail">
                    <i class="far fa-envelope"></i>
                    Email
                </label>
                <input
                        type="email"
                        id="regEmail"
                        placeholder="Введите ваш email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="regPassword">
                    <i class="fas fa-lock"></i>
                    Пароль
                </label>
                <div class="password-input">
                    <input
                            type="password"
                            id="regPassword"
                            placeholder="Создайте пароль"
                            required
                    >
                    <button type="button" class="toggle-password">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">
                    <i class="fas fa-lock"></i>
                    Подтверждение пароля
                </label>
                <div class="password-input">
                    <input
                            type="password"
                            id="regConfirmPassword"
                            placeholder="Подтвердите пароль"
                            required
                    >
                    <button type="button" class="toggle-password">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>Я согласен с <a href="#">условиями использования</a></span>
                </label>
            </div>

            <button type="submit" class="auth-btn">
                Зарегистрироваться
            </button>
        </form>
    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
