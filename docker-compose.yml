services:
  api:
    build: .
    container_name: minions-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:

      - ./app:/app/app
      - ./data:/app/data
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload