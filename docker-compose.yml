services:
  backend:
    build: ./backend
    container_name: minions-backend
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
    networks:
      - minions-network

  frontend:
    build: ./frontend
    container_name: minions-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - minions-network

networks:
  minions-network:
    driver: bridge