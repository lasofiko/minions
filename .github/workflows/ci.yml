name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system fastapi uvicorn sqlalchemy python-jose[cryptography] passlib[bcrypt] pydantic[email] pydantic-settings python-multipart

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check ./app

    - name: Test Docker build
      run: |
        docker build -t minions-test .

    - name: Run container test
      run: |
        docker run -d --name minions-test-container -p 8000:8000 minions-test
        sleep 10
        
        docker ps | grep minions-test-container
        
        curl -f http://localhost:8000/docs || \
        curl -f http://localhost:8000/redoc || \
        curl -f http://localhost:8000/openapi.json || \
        (echo "API is not responding" && exit 1)
        
        docker stop minions-test-container
        docker rm minions-test-container