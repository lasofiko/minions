name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system -r pyproject.toml

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check ./app

    - name: Test Docker build
      run: |
        docker build -t minions-test .

    - name: Run container test
      run: |
        docker run -d --name minions-test-container -p 8000:8000 minions-test
        sleep 5
        curl -f http://localhost:8000/ || exit 1
        docker stop minions-test-container
        docker rm minions-test-container